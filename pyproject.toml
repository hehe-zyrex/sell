[project]
name = "telegram-keyword-bot"
version = "1.0.0"
description = "Custom Keyword-Response Telegram UserBot"
requires-python = ">=3.9,<3.12"
dependencies = [
    "telethon==1.34.0",
    "qrcode==7.4.2",
    "Pillow==10.3.0",
    "Flask==3.0.2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
